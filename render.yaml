# Optional Render blueprint for the API. Deploy the Next.js app separately on Vercel
# (set its root directory to `web` and API_BASE_URL to this service's URL).
services:
  - type: web
    name: aviator-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false        # set in the dashboard; do not commit
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # The checked-in server/data/model.json works without configuration. MODEL_URL is an
      # alternative source when that local bundle is removed from a custom deployment.
      - key: MODEL_URL
        sync: false
